version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cmms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cmms2026
      MYSQL_DATABASE: cmms_faeterj
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - cmms_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  cmms_mysql_data:
