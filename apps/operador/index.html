<!DOCTYPE html>
<html lang="pt-BR" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=20" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20" />
    <link rel="manifest" href="/manifest.json?v=20" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vanguard Trigger" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <title>Vanguard Trigger • Corp.Vanguard</title>
    <style>
      /* Bloqueio definitivo de rolagem na janela do navegador para eliminar o overlay scrollbar nativo */
      html, body {
        height: 100% !important;
        height: 100dvh !important;
        overflow: hidden !important;
        overscroll-behavior: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #000000 !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      #root {
        height: 100% !important;
        height: 100dvh !important;
        overflow: hidden !important;
      }
      /* Oculta scrollbars WebKit e Chromium nativas */
      ::-webkit-scrollbar,
      *::-webkit-scrollbar,
      body::-webkit-scrollbar,
      html::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
        background: transparent !important;
        -webkit-appearance: none !important;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      .loaderRectangle {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0 4px;
        height: 56px;
      }
      .loaderRectangle div {
        width: 9px;
        height: 16px;
        background: #FFFFFF !important;
        border-radius: 2px;
        box-shadow: none !important;
        opacity: 1 !important;
      }
      .loaderRectangle div:nth-child(1) {
        animation: rectangleOneAnim 0.9s ease-in-out infinite -0.4s !important;
      }
      .loaderRectangle div:nth-child(2) {
        animation: rectangleTwoAnim 0.9s ease-in-out infinite -0.3s !important;
      }
      .loaderRectangle div:nth-child(3) {
        animation: rectangleThreeAnim 0.9s ease-in-out infinite -0.2s !important;
      }
      .loaderRectangle div:nth-child(4) {
        animation: rectangleFourAnim 0.9s ease-in-out infinite -0.1s !important;
      }
      .loaderRectangle div:nth-child(5) {
        animation: rectangleFiveAnim 0.9s ease-in-out infinite 0s !important;
      }
      @keyframes rectangleOneAnim {
        0%, 100% { height: 14px; opacity: 0.5; }
        50% { height: 32px; opacity: 1; }
      }
      @keyframes rectangleTwoAnim {
        0%, 100% { height: 14px; opacity: 0.5; }
        50% { height: 42px; opacity: 1; }
      }
      @keyframes rectangleThreeAnim {
        0%, 100% { height: 14px; opacity: 0.5; }
        50% { height: 52px; opacity: 1; }
      }
      @keyframes rectangleFourAnim {
        0%, 100% { height: 14px; opacity: 0.5; }
        50% { height: 42px; opacity: 1; }
      }
      @keyframes rectangleFiveAnim {
        0%, 100% { height: 14px; opacity: 0.5; }
        50% { height: 32px; opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-[#000000] text-slate-100 antialiased select-none touch-manipulation">
    <div id="root">
      <div style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'IBM Plex Sans',system-ui,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <img src="/brand/corp-vanguard-wordmark-transparent.png?v=20" alt="Corp.Vanguard" style="width:260px;max-width:85vw;object-fit:contain;" />
          <span style="color:#ffffff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;margin-top:4px;">Trigger</span>
          <div class="loaderRectangle" style="margin-top:12px;">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=50').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
